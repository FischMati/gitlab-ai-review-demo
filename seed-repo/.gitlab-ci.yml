stages:
  - validate
  - ai-review
  - plan

default:
  tags:
    - demo-runner

variables:
  TF_VERSION: "1.9.8"
  GIT_DEPTH: "20"
  KIRO_MODEL: "claude-opus-4.7"

# ---------- validate ---------------------------------------------------------
terraform:fmt+validate:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - command -v terraform || (curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip && unzip -o /tmp/tf.zip -d "$HOME/.local/bin")
    - export PATH="$HOME/.local/bin:$PATH"
    - cd terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

# ---------- AI review --------------------------------------------------------
ai-review:kiro:
  stage: ai-review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    KIRO_DIFF_FILE: "$CI_PROJECT_DIR/.kiro-diff.patch"
    KIRO_FINDINGS_FILE: "$CI_PROJECT_DIR/.kiro-findings.md"
  before_script:
    - export PATH="$HOME/.local/bin:$PATH"
    - command -v kiro-cli || curl -fsSL https://cli.kiro.dev/install | bash
    - export PATH="$HOME/.local/bin:$PATH"
    - kiro-cli --version
  script:
    - git fetch origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --depth=50 || true
    - git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA"...HEAD -- 'terraform/' > "$KIRO_DIFF_FILE" || true
    - test -s "$KIRO_DIFF_FILE" || (echo "No terraform diff in this MR; skipping" && exit 0)
    - python3 scripts/kiro_review.py "$KIRO_DIFF_FILE" "$KIRO_FINDINGS_FILE"
  artifacts:
    when: always
    paths:
      - .kiro-findings.md
      - .kiro-diff.patch
    expire_in: 1 week

# ---------- plan -------------------------------------------------------------
terraform:plan:
  stage: plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - command -v terraform || (curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip && unzip -o /tmp/tf.zip -d "$HOME/.local/bin")
    - export PATH="$HOME/.local/bin:$PATH"
    - cd terraform
    - terraform init -backend=false
    - terraform plan -input=false -no-color
